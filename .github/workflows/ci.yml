name: CI
on:
  push:
    branches: [main, master, 'phase*/**', 'trace/**']
  pull_request:
  workflow_dispatch:
    inputs:
      nightly: { type: boolean, default: false }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: Kronuz/cpp-libraries/.github/workflows/cmake.yml@main
    with:
      nightly: ${{ inputs.nightly || false }}
      cmake_args: "-DHTTP_BUILD_BENCH=ON"   # compile the bench server on every platform
