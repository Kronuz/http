name: CI
on:
  push:
    branches: [main, master, "track/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'  # nightly: flaky timing, and drift in libraries tracked at main
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: Kronuz/cpp-libraries/.github/workflows/cmake.yml@main
  clients:
    uses: Kronuz/cpp-libraries/.github/workflows/cmake.yml@main
    with:
      cmake_args: -DHTTP_BUILD_CLIENTS=ON -DHTTP_BUILD_CLIENT_TLS=ON
      apt_packages: libssl-dev
      brew_packages: openssl@3
      freebsd_packages: openssl
